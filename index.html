<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Finanzas</title>
<style>
:root{
  --fondo:#0b1622; --sup:#132030; --sup2:#1c2b3f; --linea:#2a3b52; --vidrio:rgba(19,32,48,.84); --f1:#3fb8a0; --f2:#5b7fd6;
  --tinta:#ebe7dc; --tenue:#9498ad; --oro:#f2c14e; --oro-osc:#3a3115;
  --favor:#5fd0a4; --contra:#ff8585;
  --num:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --txt:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--fondo);color-scheme:dark}
body{margin:0;background:transparent;color:var(--tinta);font:15px/1.45 var(--txt);min-height:100vh;
  padding:0 0 calc(86px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.tenue{color:var(--tenue)} .favor{color:var(--favor)} .contra{color:var(--contra)}

/* estructura */
.app{max-width:600px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header.top h1{flex:1;margin:0;font:600 22px/1.2 var(--num)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;background:var(--sup);border:1px solid var(--linea);font-size:13px;color:var(--tenue)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tenue)}
.chip.ok i{background:var(--favor)} .chip.mal i{background:var(--contra)} .chip.va i{background:var(--oro)}
.icono{width:34px;height:34px;border-radius:17px;background:var(--sup);border:1px solid var(--linea);font-size:16px}

nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,22,34,.92);backdrop-filter:blur(10px);border-top:1px solid var(--linea);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.abajo button{flex:1;max-width:120px;padding:6px 2px;border-radius:12px;color:var(--tenue);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1) opacity(.7)}
nav.abajo button.on{color:var(--oro)} nav.abajo button.on span{filter:none}
.mas{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:50%;
  background:var(--oro);color:#1d1705;font:400 34px/1 var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mas:active{transform:scale(.95)}

/* ticket: el resumen principal, con borde troquelado */
.ticket{background:var(--sup);padding:20px 18px 24px;margin:6px 0 18px;
  --d:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px);
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,var(--d) bottom left/16px 8px repeat-x;
          mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,var(--d) bottom left/16px 8px repeat-x;
  border-radius:14px 14px 0 0}
.ticket .mes{color:var(--tenue);font-size:13px}
.ticket .total{font:600 44px/1.05 var(--num);font-variant-numeric:tabular-nums lining-nums;margin:2px 0 14px;color:var(--oro);overflow-wrap:anywhere}
.renglon{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.renglon .guia{flex:1;border-bottom:1.5px dotted var(--linea);transform:translateY(-4px);min-width:16px}
.renglon b{font:600 16px var(--num);font-variant-numeric:tabular-nums}

h2{font:600 17px/1.3 var(--num);margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 13px var(--txt);color:var(--tenue);margin-left:auto}
h2>button{margin-left:auto;font:500 13px var(--txt);color:var(--oro)}
h2>.seg{margin-left:auto;font:400 13.5px var(--txt);align-self:center}
.tarjeta{background:var(--sup);border-radius:14px;padding:4px 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos>*{background:var(--sup);border-radius:14px;padding:12px 14px;text-align:left;display:block}
.dos b{display:block;font:600 21px var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .em{flex:0 0 36px;height:36px;border-radius:10px;background:var(--sup2);display:grid;place-items:center;font-size:18px}
.fila .med{flex:1;min-width:0}
.fila .med div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .med small{display:block;color:var(--tenue);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{text-align:right;font:600 15.5px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .der small{display:block;font:400 12px var(--txt);color:var(--tenue)}
.dia{display:flex;justify-content:space-between;color:var(--tenue);font-size:12.5px;margin:16px 2px 4px}
.vacio{color:var(--tenue);text-align:center;padding:26px 10px}
.vacio b{display:block;color:var(--tinta);font:600 16px var(--num);margin-bottom:4px}

/* controles */
.barra{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.mesnav{display:flex;align-items:center;gap:2px;background:var(--sup);border-radius:12px;padding:3px}
.mesnav button{width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--tenue)}
.mesnav b{min-width:128px;text-align:center;font:600 15px var(--num)}
.seg{display:flex;background:var(--sup);border-radius:12px;padding:3px;margin-left:auto}
.seg button{padding:7px 13px;border-radius:9px;color:var(--tenue);font-size:13.5px}
.seg button.on{background:var(--sup2);color:var(--tinta)}
input[type=text],input[type=search],input[type=date],input[type=password],input[inputmode],select,textarea{
  width:100%;background:var(--sup2);border:1px solid var(--linea);border-radius:11px;padding:11px 12px;min-height:44px;color:var(--tinta)}
input::placeholder{color:#6d7187}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tenue) 50%),linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.filtros{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:6px}
.marca{display:inline-flex;align-items:center;gap:7px;color:var(--tenue);font-size:13px;margin:2px 0 4px}
.marca input{width:18px;height:18px;accent-color:var(--oro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--oro);color:#1d1705;font-weight:600}
.btn.sec{background:var(--sup2);color:var(--tinta);font-weight:500}
.btn.pel{background:none;color:var(--contra);font-weight:500}
.btn.ch{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fila-btn .btn{flex:1}

/* barras de categorías y presupuesto */
.cat{padding:10px 0;border-bottom:1px solid var(--linea)} .cat:last-child{border-bottom:0}
.cat .cab{display:flex;gap:8px;align-items:baseline}
.cat .cab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cab b{font:600 15px var(--num);font-variant-numeric:tabular-nums}
.cat .cab small{color:var(--tenue);width:38px;text-align:right;font-size:12.5px}
.pista{height:8px;border-radius:4px;background:var(--sup2);margin-top:6px;overflow:hidden}
.pista i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--oro);min-width:2px}
.pista.presu i{background:var(--favor)} .pista.presu.pasado i{background:var(--contra)}
.nota{color:var(--tenue);font-size:12.5px;margin-top:4px}
.comp{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;background:var(--sup2)}

/* hoja inferior */
.velo{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.66);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--sup);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}
.hoja .cabeza{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--sup);padding:12px 0 8px;z-index:2}
.hoja .cabeza h3{flex:1;margin:0;font:600 19px var(--num)}
.hoja .cabeza button{width:36px;height:36px;border-radius:18px;background:var(--sup2);color:var(--tenue);font-size:16px}
label.c{display:block;margin:10px 0 0;font-size:13px;color:var(--tenue)}
label.c>input,label.c>select,label.c>textarea{margin-top:5px}
.monto{font:600 30px var(--num)!important;text-align:left;padding:10px 12px!important;color:var(--oro)!important}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.elige{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.elige label{position:relative}
.elige input{position:absolute;opacity:0;pointer-events:none}
.elige span{display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border-radius:11px;background:var(--sup2);border:1px solid var(--linea);font-size:13.5px;color:var(--tinta)}
.elige input:checked+span{background:var(--oro-osc);border-color:var(--oro);color:var(--oro)}
.elige input:focus-visible+span{outline:2px solid var(--oro);outline-offset:2px}
.saldo{font:600 34px var(--num);font-variant-numeric:tabular-nums;margin:2px 0 2px;overflow-wrap:anywhere}
.aviso{background:var(--sup2);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--tenue);margin:10px 0}
.tostada{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--tinta);color:#14161f;padding:10px 16px;border-radius:12px;font-weight:500;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.it{display:grid;grid-template-columns:64px 12px 1fr auto 36px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
.it:last-child{border-bottom:0}
.it .itn{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it input{min-height:40px;padding:8px 10px}
.it b{font:600 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:74px;text-align:right}
#items select{margin-top:8px} #items .tarjeta{background:var(--sup2);margin-top:6px} #items .tarjeta input{background:var(--sup)}
#itNuevo{grid-template-columns:1fr 104px auto;margin-top:8px}
input[readonly]{opacity:.85;border-style:dashed}
.tarjeta,.ticket,.dos>*,.mesnav,.seg,.chip,.icono,.pres{background:var(--vidrio)}
.btn.sec{background:rgba(28,43,63,.9)}
/* ---- fondo animado (diseño "Fondo calmo finanzas") ---- */
#fondo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--fondo)}
#fondo.quieto>*{display:none}
#fondo .blob{position:absolute;border-radius:50%;filter:blur(40px);will-change:transform}
#fondo .b1{width:360px;height:360px;left:-120px;top:-80px;background:radial-gradient(circle,var(--f1) 0%,transparent 70%);opacity:.32;animation:bgDrift1 26s ease-in-out infinite alternate}
#fondo .b2{width:420px;height:420px;right:-180px;top:260px;background:radial-gradient(circle,var(--f2) 0%,transparent 70%);opacity:.26;animation:bgDrift2 32s ease-in-out infinite alternate}
#fondo .b3{width:320px;height:320px;left:-60px;bottom:60px;background:radial-gradient(circle,var(--f1) 0%,transparent 70%);opacity:.18;animation:bgDrift3 38s ease-in-out infinite alternate}
#fondo .centro{position:absolute;left:50%;top:352px;width:240px;height:240px;margin:-120px 0 0 -120px}
#fondo .aro{position:absolute;inset:0;border-radius:50%;border:1px solid var(--f1);box-shadow:0 0 60px 0 var(--f1);animation:bgBreathe 10s ease-in-out infinite}
#fondo .aro2{position:absolute;inset:40px;border-radius:50%;border:1px solid var(--f2);opacity:.25}
#fondo .cara{position:absolute;left:30px;top:46px;width:180px;height:148px;object-fit:contain;mix-blend-mode:screen;animation:bgFloat 10s ease-in-out infinite}
#fondo .punto{position:absolute;border-radius:50%;background:#cfefe7;animation:bgRise linear infinite}
#fondo .mar{position:absolute;left:0;bottom:0;width:200%;min-width:780px;will-change:transform}
#fondo .mar svg{display:block;width:100%;height:100%;will-change:transform}
#fondo .m1{animation:bgBob 7s ease-in-out infinite} #fondo .m1 svg{animation:bgFlow 26s linear infinite}
#fondo .m2{animation:bgBob 9s ease-in-out -3s infinite} #fondo .m2 svg{animation:bgFlow 38s linear infinite reverse}
#fondo .m3{animation:bgBob 11s ease-in-out -6s infinite} #fondo .m3 svg{animation:bgFlow 54s linear infinite}
@keyframes bgDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,90px) scale(1.15)}}
@keyframes bgDrift2{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-70px,-60px) scale(.95)}}
@keyframes bgDrift3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,-80px) scale(1.2)}}
@keyframes bgBreathe{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.08);opacity:.6}}
@keyframes bgFloat{0%,100%{transform:translateY(4px) scale(.98)}50%{transform:translateY(-4px) scale(1.02)}}
@keyframes bgBob{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
@keyframes bgFlow{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes bgRise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-520px);opacity:0}}
@media (prefers-reduced-motion:reduce){#fondo *{animation:none!important}}
/* ---- cuadros de presupuesto ---- */
.presus{display:grid;gap:12px;margin:6px 0 14px}
.pres{border:1px solid var(--linea);border-radius:20px;padding:16px 18px 14px;min-width:0}
.pcab{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap;color:var(--tenue);font-size:13px;min-height:26px}
.pcab span{white-space:nowrap}
.pcab .comp{font-weight:600;background:var(--sup2)}
.pnum{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:4px 0 16px}
.pnum b{font:600 44px/1.05 var(--num);font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.pres.sem .pnum b{font-size:34px}
.pnum span{color:var(--tenue)}
.ritmo{position:relative;height:10px;border-radius:5px;background:var(--sup2);margin:0 0 10px}
.ritmo i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--favor);min-width:10px}
.ritmo.pasado i{background:var(--contra)}
.ritmo u{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--tinta);border-radius:1px}
.ppie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--tenue);font-size:13px}
.ppie b{color:var(--tinta);font-weight:600}
.pres .renglon{font-size:14px} .pres .renglones{margin-top:10px;border-top:1px solid var(--linea);padding-top:6px}
.dbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:0 0 10px}
.dbars div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--tenue)}
.dbars s{display:flex;align-items:flex-end;width:100%;max-width:30px;height:46px;border-bottom:2px dotted var(--linea);text-decoration:none}
.dbars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--tenue)}
.dbars .hoy{color:var(--tinta);font-weight:700} .dbars .hoy s{border-bottom:3px solid var(--tinta)} .dbars .hoy i{background:var(--oro)}
.dbars .pas i{background:var(--contra)}
@media (min-width:900px){.presus{grid-template-columns:1.55fr 1fr}}
svg.linea{display:block;width:100%;height:84px;margin:8px 0 2px}

@media (min-width:900px){
  body{padding-bottom:30px}
  nav.abajo{top:0;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--linea);padding:86px 12px 12px;backdrop-filter:none;background:rgba(11,22,34,.72)}
  nav.abajo button{flex:0;max-width:none;width:100%;flex-direction:row;gap:12px;padding:11px 12px;font-size:14.5px}
  .app{padding-left:216px;max-width:1010px}
  .mas{right:32px;bottom:32px}
  .velo{align-items:center} .hoja{border-radius:20px;max-height:88vh}
  .tostada{bottom:40px}
}
</style>
</head>
<body>
<div id="fondo" aria-hidden="true">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<script>
(function(){
'use strict';
var PFX='mis-finanzas:', K_DATA=PFX+'data', K_TOKEN=PFX+'token', K_GIST=PFX+'gist', K_LAST=PFX+'ultima-sync';
var K_FONDO=PFX+'fondo';
var K_TOKEN_HAB='rastreador-habitos:sync-token';
var FILE='mis-finanzas-sync.json', API='https://api.github.com';
var COLS=['gastos','cats','prods','precios','personas','movs','fijos'];
var MEDIOS=['Efectivo','Débito','Crédito','Transferencia','Mercado Pago'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var CATS0=[['comida','Comida','🍔'],['super','Supermercado','🛒'],['transporte','Transporte','🚌'],['facultad','Facultad','🎓'],['salidas','Salidas','🎉'],
  ['suscripciones','Suscripciones','📺'],['salud','Salud','💊'],['ropa','Ropa','👕'],['hogar','Hogar','🏠'],['otros','Otros','📦']];
var TABS=[['inicio','Inicio','🧾'],['gastos','Gastos','💸'],['fijos','Fijos','🔁'],['precios','Precios','🏷️'],['deudas','Deudas','🤝']];

/* ---------- utilidades ---------- */
var LS=window.localStorage;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function p2(n){return (n<10?'0':'')+n}
function clave(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function hoy(){return clave(new Date())}
function fecha(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function esFecha(k){return typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)&&!isNaN(fecha(k).getTime())}
function sumaDias(k,n){var d=fecha(k);d.setDate(d.getDate()+n);return clave(d)}
function lunes(k){var d=fecha(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return clave(d)}
function mesDe(k){return k.slice(0,7)}
function mesSuma(m,n){var a=m.split('-'),d=new Date(+a[0],+a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function mesNombre(m){var a=m.split('-');return MESES[+a[1]-1].charAt(0).toUpperCase()+MESES[+a[1]-1].slice(1)+' '+a[0]}
function fCorta(k){var d=fecha(k);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function fDia(k){var h=hoy();if(k===h)return 'Hoy';if(k===sumaDias(h,-1))return 'Ayer';var d=fecha(k);return DIAS[d.getDay()].charAt(0).toUpperCase()+DIAS[d.getDay()].slice(1)+' '+d.getDate()+' de '+MESES[d.getMonth()]}
var fmtN=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});
function plata(n){n=Math.round((+n||0)*100)/100;return (n<0?'−':'')+'$ '+fmtN.format(Math.abs(n))}
function aNum(s){
  s=String(s==null?'':s).replace(/[^\d.,-]/g,'');if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;
}
function pct(a,b){return b>0?Math.round((a-b)/b*100):null}
function tostada(t){var e=$('#tostada');e.textContent=t;e.hidden=false;clearTimeout(tostada.t);tostada.t=setTimeout(function(){e.hidden=true},2600)}

/* ---------- datos ---------- */
var DB=null;
function vacia(){var d={v:1,cfg:{presu:0,presuSem:0,upd:0}};COLS.forEach(function(c){d[c]={}});return d}
function sembrar(d){CATS0.forEach(function(c,i){var id='c-'+c[0];if(!d.cats[id])d.cats[id]={id:id,nombre:c[1],emoji:c[2],presu:0,orden:i,upd:1}})}
function normal(raw){
  var d=vacia();
  if(raw&&typeof raw==='object'){
    COLS.forEach(function(c){var o=raw[c];if(o&&typeof o==='object')Object.keys(o).forEach(function(id){var r=o[id];if(r&&typeof r==='object'&&r.id===id)d[c][id]=r})});
    if(raw.cfg&&typeof raw.cfg==='object')d.cfg={presu:+raw.cfg.presu||0,presuSem:+raw.cfg.presuSem||0,upd:+raw.cfg.upd||0};
  }
  sembrar(d);return d;
}
function cargar(){try{DB=normal(JSON.parse(LS.getItem(K_DATA)||'null'))}catch(e){DB=normal(null)}}
function guardarLocal(){try{LS.setItem(K_DATA,JSON.stringify(DB))}catch(e){tostada('No se pudo guardar: el almacenamiento está lleno')}}
function guardar(){guardarLocal();pintar();programarSync(2500)}
function vivos(c){return Object.keys(DB[c]).map(function(id){return DB[c][id]}).filter(function(r){return !r.del})}
function pon(c,r){if(!r.id)r.id=uid();r.upd=Date.now();delete r.del;DB[c][r.id]=r;return r}
function borra(c,id){var r=DB[c][id];if(r){DB[c][id]={id:id,del:1,upd:Date.now()}}}
/* combina otra copia: por cada registro gana el modificado más tarde. Devuelve qué lado tenía algo nuevo. */
function combinar(otra){
  var cambioLocal=false,localNuevo=false;otra=normal(otra);
  COLS.forEach(function(c){
    Object.keys(otra[c]).forEach(function(id){var r=otra[c][id],l=DB[c][id];if(!l||(+r.upd||0)>(+l.upd||0)){DB[c][id]=r;cambioLocal=true}});
    Object.keys(DB[c]).forEach(function(id){var r=otra[c][id],l=DB[c][id];if(!r||(+l.upd||0)>(+r.upd||0))localNuevo=true});
  });
  if(otra.cfg.upd>DB.cfg.upd){DB.cfg=otra.cfg;cambioLocal=true}else if(DB.cfg.upd>otra.cfg.upd)localNuevo=true;
  return {cambioLocal:cambioLocal,localNuevo:localNuevo};
}

function cats(){return vivos('cats').sort(function(a,b){return (a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre)})}
function cat(id){var c=DB.cats[id];return c&&!c.del?c:(DB.cats['c-otros']&&!DB.cats['c-otros'].del?DB.cats['c-otros']:{id:'c-otros',nombre:'Otros',emoji:'📦',presu:0})}
function gastos(){return vivos('gastos')}
function gastosMes(m){return gastos().filter(function(g){return mesDe(g.fecha)===m})}
function suma(a){return a.reduce(function(t,g){return t+(+g.monto||0)},0)}

/* ---------- gastos fijos ---------- */
function diasMes(y,m){return new Date(y,m+1,0).getDate()}
/* fechas de cobro de un fijo desde su inicio hasta `hasta` (incluido), más la siguiente */
function cobros(f,hasta){
  var ini=fecha(f.inicio),y=ini.getFullYear(),m=ini.getMonth(),paso=f.frec==='anual'?12:1,out=[],prox=null,n=0;
  while(n++<600){
    var k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))));
    if(k>=f.inicio){if(k<=hasta)out.push(k);else{prox=k;break}}
    m+=paso;y+=Math.floor(m/12);m%=12;
  }
  return {hechos:out,prox:prox};
}
function generarFijos(){
  var h=hoy(),hubo=false;
  vivos('fijos').forEach(function(f){
    if(f.activo===false||!esFecha(f.inicio))return;
    cobros(f,h).hechos.forEach(function(k){
      var id='fx-'+f.id+'-'+mesDe(k);
      if(DB.gastos[id])return;            /* ya registrado (o borrado a mano): no se repite */
      DB.gastos[id]={id:id,monto:f.monto,cat:f.cat,fecha:k,medio:f.medio||'',nota:f.nombre,fijo:f.id,upd:Date.now()};hubo=true;
    });
  });
  return hubo;
}
function proximoCobro(f){if(f.activo===false||!esFecha(f.inicio))return null;return cobros(f,hoy()).prox}
function fijosMensual(){return vivos('fijos').filter(function(f){return f.activo!==false}).reduce(function(t,f){return t+(f.frec==='anual'?f.monto/12:f.monto)},0)}

/* ---------- deudas ---------- */
/* signo +1: aumenta lo que te deben · -1: aumenta lo que debés */
var TIPOS={presto:['Le presté',1],meprestaron:['Me prestó',-1],mepago:['Me pagó',-1],lepague:['Le pagué',1]};
function saldo(pid){return vivos('movs').filter(function(m){return m.persona===pid}).reduce(function(t,m){return t+(TIPOS[m.tipo]?TIPOS[m.tipo][1]:0)*(+m.monto||0)},0)}
function totalesDeuda(){var a=0,b=0;vivos('personas').forEach(function(p){var s=Math.round(saldo(p.id)*100)/100;if(s>0)a+=s;else b-=s});return {meDeben:a,debo:b}}
function personaPorNombre(n){n=n.trim();var low=n.toLowerCase();var p=vivos('personas').filter(function(x){return x.nombre.toLowerCase()===low})[0];return p||pon('personas',{nombre:n})}

/* ---------- estado de pantalla ---------- */
var S={tab:'inicio',mes:mesDe(hoy()),sub:'lista',q:'',fcat:'',todo:false,pq:'',hist:'sem'};

function pintar(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'"'+(S.tab===t[0]?' aria-current="page"':'')+'><span>'+t[2]+'</span>'+t[1]+'</button>'}).join('');
  $('#titulo').textContent={inicio:'Mis Finanzas',gastos:'Gastos',fijos:'Gastos fijos',precios:'Precios',deudas:'Deudas'}[S.tab];

  pintarNube();
}
function filaGasto(g,conFecha){
  var c=cat(g.cat);
  return '<button class="fila" data-a="editarGasto" data-id="'+esc(g.id)+'"><span class="em">'+esc(c.emoji)+'</span><span class="med"><div>'+esc(g.nota||c.nombre)+'</div><small>'+
    esc([g.nota?c.nombre:'',g.items&&g.items.length?g.items.length+(g.items.length===1?' producto':' productos'):'',g.medio,g.fijo?'Fijo':'',conFecha?fCorta(g.fecha):''].filter(Boolean).join(', '))+'</small></span><span class="der">'+plata(g.monto)+'</span></button>';
}
function barraPresu(gastado,presu,texto){
  if(!(presu>0))return '';
  var q=presu-gastado,pc=Math.min(100,gastado/presu*100);
  return '<div class="pista presu'+(q<0?' pasado':'')+'" role="img" aria-label="'+esc(texto)+'"><i style="width:'+pc.toFixed(1)+'%"></i></div><div class="nota">'+
    (q>=0?'Te quedan '+plata(q)+' de '+plata(presu):'Te pasaste '+plata(-q)+' del presupuesto de '+plata(presu))+'</div>';
}

var V={};
/* presupuesto semanal: el que pusiste, o la parte proporcional del mensual */
function presuSem(){var c=DB.cfg;if(c.presuSem>0)return c.presuSem;if(c.presu>0){var h=fecha(hoy());return Math.round(c.presu/diasMes(h.getFullYear(),h.getMonth())*7)}return 0}
function tarjetaMes(tMes,tHoy){
  var h=fecha(hoy()),D=diasMes(h.getFullYear(),h.getMonth()),d=h.getDate(),P=DB.cfg.presu,nom=MESES[h.getMonth()];
  var filas='<div class="renglones"><div class="renglon"><span>Hoy</span><span class="guia"></span><b>'+plata(tHoy)+'</b></div><div class="renglon"><span>Fijos por mes</span><span class="guia"></span><b>'+plata(fijosMensual())+'</b></div></div>';
  if(!(P>0))return '<section class="pres"><div class="pcab"><span>Gastaste en '+nom+'</span></div><div class="pnum"><b style="color:var(--oro)">'+plata(tMes)+'</b></div>'+
    '<div class="ppie"><span>Poné un presupuesto para ver cuánto te queda y si venís bien.</span></div><div class="fila-btn"><button class="btn sec" data-a="ajustes">Poner presupuesto</button></div>'+filas+'</section>';
  var q=P-tMes,ritmo=Math.round(P*d/D-tMes),N=D-d+1;
  var sello=q<0?'<span class="comp contra">Te pasaste</span>':ritmo>=0?'<span class="comp favor">'+plata(ritmo)+' bajo el ritmo</span>':'<span class="comp contra">'+plata(-ritmo)+' sobre el ritmo</span>';
  return '<section class="pres"><div class="pcab"><span>Tu presupuesto de '+nom+'</span>'+sello+'</div>'+
    '<div class="pnum"><b class="'+(q<0?'contra':'')+'">'+plata(Math.abs(q))+'</b><span>'+(q<0?'de más':'te quedan')+'</span></div>'+
    '<div class="ritmo'+(q<0?' pasado':'')+'" role="img" aria-label="Gastaste '+esc(plata(tMes))+' de '+esc(plata(P))+'. Va el día '+d+' de '+D+'."><i style="width:'+Math.min(100,tMes/P*100).toFixed(1)+'%"></i><u style="left:'+(d/D*100).toFixed(1)+'%" title="Hoy: día '+d+' de '+D+'"></u></div>'+
    '<div class="ppie"><span>Gastado <b>'+plata(tMes)+'</b> de '+plata(P)+'</span><span>'+plata(Math.round(Math.max(0,q)/N))+' al día, '+N+(N===1?' día':' días')+'</span></div>'+filas+'</section>';
}
function tarjetaSem(gs){
  var h=hoy(),lu=lunes(h),PS=presuSem(),dias=[],tot=0,i;
  for(i=0;i<7;i++){(function(k){var t=suma(gs.filter(function(g){return g.fecha===k}));dias.push({k:k,t:t});tot+=t})(sumaDias(lu,i))}
  var tope=PS>0?PS/7:Math.max.apply(null,dias.map(function(x){return x.t}).concat([1])),resto=dias.filter(function(x){return x.k>=h}).length,q=PS-tot;
  var barras='<div class="dbars" role="img" aria-label="Gasto por día de esta semana">'+dias.map(function(x,j){
    return '<div class="'+(x.k===h?'hoy':'')+(PS>0&&x.t>tope?' pas':'')+'" title="'+esc(fDia(x.k)+': '+plata(x.t))+'"><s>'+(x.t>0?'<i style="height:'+Math.max(10,Math.min(100,x.t/tope*100)).toFixed(0)+'%"></i>':'')+'</s>'+'LMMJVSD'.charAt(j)+'</div>'}).join('')+'</div>';
  return '<section class="pres sem"><div class="pcab"><span>Esta semana</span><span>'+(resto===1?'último día':'quedan '+resto+' días')+'</span></div>'+
    (PS>0?'<div class="pnum"><b class="'+(q<0?'contra':'')+'">'+plata(Math.abs(q))+'</b><span>'+(q<0?'de más':'por gastar')+'</span></div>':'<div class="pnum"><b>'+plata(tot)+'</b><span>gastados</span></div>')+barras+
    (PS>0?'<div class="ppie"><span>Gastado <b>'+plata(tot)+'</b> de '+plata(PS)+'</span>'+(q>0?'<span>'+plata(Math.round(q/resto))+' al día</span>':'')+'</div>':'')+'</section>';
}
function historial(gs){
  if(!gs.length)return '';
  var primero=gs.reduce(function(m,g){return g.fecha<m?g.fecha:m},hoy()),h=hoy(),out=[],i;
  if(S.hist==='mes'){var m=mesDe(h);for(i=0;i<12&&m>=mesDe(primero);i++){out.push({et:mesNombre(m),t:suma(gastosMes(m)),p:DB.cfg.presu,mes:m,actual:i===0});m=mesSuma(m,-1)}}
  else{var lu=lunes(h),ps=presuSem();for(i=0;i<12;i++){var fin=sumaDias(lu,6);if(fin<primero)break;
    out.push({et:i===0?'Esta semana':i===1?'Semana pasada':fCorta(lu)+' al '+fCorta(fin),t:suma(gs.filter((function(a,b){return function(g){return g.fecha>=a&&g.fecha<=b}})(lu,fin))),p:ps,actual:i===0});lu=sumaDias(lu,-7)}}
  return '<h2>Historial<div class="seg"><button data-a="hist" data-h="sem" class="'+(S.hist==='sem'?'on':'')+'">Semanas</button><button data-a="hist" data-h="mes" class="'+(S.hist==='mes'?'on':'')+'">Meses</button></div></h2><div class="tarjeta">'+out.map(function(x){
    var q=x.p-x.t,cuerpo='<div class="cab"><span>'+esc(x.et)+'</span><b>'+plata(x.t)+'</b></div>'+(x.p>0?'<div class="pista presu'+(q<0?' pasado':'')+'" role="img" aria-label="'+esc(plata(x.t)+' de '+plata(x.p))+'"><i style="width:'+Math.min(100,x.t/x.p*100).toFixed(1)+'%"></i></div><div class="nota">'+
      (q<0?'Te pasaste '+plata(-q):(x.actual?'Te quedan ':'Te sobraron ')+plata(q))+' de '+plata(x.p)+'</div>':'');
    return x.mes?'<button class="cat" style="display:block;width:100%;text-align:left" data-a="irMes" data-m="'+x.mes+'">'+cuerpo+'</button>':'<div class="cat">'+cuerpo+'</div>'}).join('')+'</div>';
}
V.inicio=function(){
  var h=hoy(),m=mesDe(h),gs=gastos(),gm=gs.filter(function(g){return mesDe(g.fecha)===m});
  var tHoy=suma(gs.filter(function(g){return g.fecha===h})),tMes=suma(gm);
  var d=totalesDeuda();
  var prox=vivos('fijos').map(function(f){return {f:f,k:proximoCobro(f)}}).filter(function(x){return x.k}).sort(function(a,b){return a.k<b.k?-1:1}).slice(0,3);
  var ult=gs.slice().sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.upd||0)-(a.upd||0)}).slice(0,8);
  return '<div class="presus">'+tarjetaMes(tMes,tHoy)+tarjetaSem(gs)+'</div>'+
    '<div class="dos"><button data-a="tab" data-t="deudas"><span class="tenue">Te deben</span><b class="favor">'+plata(d.meDeben)+'</b></button>'+
    '<button data-a="tab" data-t="deudas"><span class="tenue">Debés</span><b class="'+(d.debo>0?'contra':'')+'">'+plata(d.debo)+'</b></button></div>'+
    (prox.length?'<h2>Próximos fijos</h2><div class="tarjeta">'+prox.map(function(x){var c=cat(x.f.cat);return '<button class="fila" data-a="editarFijo" data-id="'+esc(x.f.id)+'"><span class="em">'+esc(c.emoji)+'</span><span class="med"><div>'+esc(x.f.nombre)+'</div><small>'+fDia(x.k)+'</small></span><span class="der">'+plata(x.f.monto)+'</span></button>'}).join('')+'</div>':'')+
    '<h2>Últimas compras'+(gs.length>ult.length?'<button data-a="tab" data-t="gastos">Ver todas</button>':'')+'</h2>'+(ult.length?'<div class="tarjeta">'+ult.map(function(g){return filaGasto(g,true)}).join('')+'</div>':
      '<div class="vacio"><b>Todavía no cargaste gastos</b>Tocá el + para anotar el primero.</div>')+historial(gs);
};

function gastosFiltrados(){
  var q=S.q.trim().toLowerCase();
  return gastos().filter(function(g){
    if(!S.todo&&mesDe(g.fecha)!==S.mes)return false;
    if(S.fcat&&cat(g.cat).id!==S.fcat)return false;
    if(q&&(g.nota||'').toLowerCase().indexOf(q)<0&&cat(g.cat).nombre.toLowerCase().indexOf(q)<0&&(g.medio||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.upd||0)-(a.upd||0)});
}
function listaGastos(){
  var l=gastosFiltrados();if(!l.length)return '<div class="vacio"><b>No hay gastos para mostrar</b>'+(S.q||S.fcat?'Probá con otro filtro.':'Tocá el + para anotar uno.')+'</div>';
  var out='<div class="dia"><span>'+l.length+(l.length===1?' gasto':' gastos')+'</span><span>Total '+plata(suma(l))+'</span></div>',dia='';
  l.forEach(function(g,i){
    if(g.fecha!==dia){if(dia)out+='</div>';dia=g.fecha;out+='<div class="dia"><span>'+fDia(dia)+(S.todo&&mesDe(dia)!==mesDe(hoy())?' '+dia.slice(0,4):'')+'</span><span>'+plata(suma(l.filter(function(x){return x.fecha===dia})))+'</span></div><div class="tarjeta">'}
    out+=filaGasto(g,false);
  });
  return out+'</div>';
}
function resumenGastos(){
  var gm=gastosMes(S.mes),tot=suma(gm),ant=suma(gastosMes(mesSuma(S.mes,-1))),dif=pct(tot,ant);
  var por={};gm.forEach(function(g){var id=cat(g.cat).id;por[id]=(por[id]||0)+(+g.monto||0)});
  var filas=cats().map(function(c){return {c:c,t:por[c.id]||0}}).filter(function(x){return x.t>0||x.c.presu>0}).sort(function(a,b){return b.t-a.t});
  var max=Math.max.apply(null,filas.map(function(x){return x.t}).concat([1]));
  var comp=ant>0?'<span class="comp '+(tot>ant?'contra':'favor')+'">'+(tot>ant?'▲ ':'▼ ')+Math.abs(dif)+'% contra '+MESES[+mesSuma(S.mes,-1).slice(5)-1]+' ('+plata(ant)+')</span>':
    '<span class="comp tenue">Sin gastos en '+MESES[+mesSuma(S.mes,-1).slice(5)-1]+' para comparar</span>';
  return '<section class="ticket"><div class="mes">Total de '+mesNombre(S.mes).toLowerCase()+'</div><div class="total">'+plata(tot)+'</div>'+comp+barraPresu(tot,DB.cfg.presu,'Presupuesto del mes')+'</section>'+
    '<h2>Por categoría</h2>'+(filas.length?'<div class="tarjeta">'+filas.map(function(x){
      return '<div class="cat"><div class="cab"><span>'+esc(x.c.emoji)+' '+esc(x.c.nombre)+'</span><b>'+plata(x.t)+'</b><small>'+(tot>0?Math.round(x.t/tot*100):0)+'%</small></div>'+
        '<div class="pista" role="img" aria-label="'+esc(x.c.nombre+': '+plata(x.t))+'"><i style="width:'+(x.t/max*100).toFixed(1)+'%"></i></div>'+barraPresu(x.t,x.c.presu,'Presupuesto de '+x.c.nombre)+'</div>'}).join('')+'</div>':
      '<div class="vacio"><b>Sin gastos este mes</b>Cuando cargues gastos vas a ver en qué se va la plata.</div>')+
    '<div class="fila-btn"><button class="btn sec" data-a="ajustes">Presupuestos y categorías</button><button class="btn sec" data-a="csv">Exportar planilla</button></div>';
}
V.gastos=function(){
  return '<div class="barra"><div class="mesnav"><button data-a="mes" data-n="-1" aria-label="Mes anterior">‹</button><b>'+mesNombre(S.mes)+'</b><button data-a="mes" data-n="1" aria-label="Mes siguiente">›</button></div>'+

    '<select id="fcat" aria-label="Filtrar por categoría"><option value="">Todas</option>'+cats().map(function(c){return '<option value="'+esc(c.id)+'"'+(S.fcat===c.id?' selected':'')+'>'+esc(c.emoji+' '+c.nombre)+'</option>'}).join('')+'</select></div>'+

};

function cerrar(){$('#hoja').innerHTML=''}
function opCats(sel){return cats().map(function(c){return '<label><input type="radio" name="cat" value="'+esc(c.id)+'"'+(c.id===sel?' checked':'')+'><span>'+esc(c.emoji)+' '+esc(c.nombre)+'</span></label>'}).join('')}
function opMedios(sel){return '<option value="">Sin indicar</option>'+MEDIOS.map(function(m){return '<option'+(m===sel?' selected':'')+'>'+m+'</option>'}).join('')}
function campoMonto(v,auto){return '<label class="c">Monto<input class="monto" name="monto" inputmode="decimal" autocomplete="off" placeholder="$ 0" value="'+(v?esc(fmtN.format(v)):'')+'"'+(auto?' autofocus':'')+' required></label>'}
function ultimoMedio(){var g=gastos().sort(function(a,b){return (b.upd||0)-(a.upd||0)})[0];return g?g.medio||'':''}

/* productos del gasto que se está cargando */
var IT=[],ITL='';
function totalItems(){return Math.round(IT.reduce(function(t,i){return t+(+i.cant||0)*(+i.precio||0)},0)*100)/100}
function ultimoPrecio(pid){var h=preciosDe(pid);return h.length?h[h.length-1].monto:0}
function prodPorNombre(n){n=n.trim();var low=n.toLowerCase();var p=vivos('prods').filter(function(x){return x.nombre.toLowerCase()===low})[0];return p||pon('prods',{nombre:n})}
function bloqueItems(){
  var ps=vivos('prods').sort(function(a,b){return a.nombre.localeCompare(b.nombre)}),lugares={};
  vivos('precios').forEach(function(p){if(p.lugar)lugares[p.lugar]=1});
  return (IT.length?'<div class="tarjeta">'+IT.map(function(it,i){
      return '<div class="it"><div class="itn">'+esc(it.nombre)+'</div><input data-i="'+i+'" data-k="cant" inputmode="decimal" autocomplete="off" value="'+esc(fmtN.format(it.cant))+'" aria-label="Cantidad de '+esc(it.nombre)+'">'+
        '<span class="tenue">×</span><input data-i="'+i+'" data-k="precio" inputmode="decimal" autocomplete="off" value="'+(it.precio?esc(fmtN.format(it.precio)):'')+'" placeholder="Precio" aria-label="Precio de '+esc(it.nombre)+'">'+
        '<b id="its'+i+'">'+plata((+it.cant||0)*(+it.precio||0))+'</b><button type="button" class="btn pel ch" data-a="itQuita" data-i="'+i+'" aria-label="Quitar '+esc(it.nombre)+'">✕</button></div>'}).join('')+'</div>':'')+
    '<select id="itAdd" aria-label="Agregar un producto al gasto"><option value="">'+(IT.length?'Agregar otro producto…':'Armar el gasto con productos…')+'</option>'+
      ps.map(function(p){var u=ultimoPrecio(p.id);return '<option value="'+esc(p.id)+'">'+esc(p.nombre+(u?' ('+plata(u)+')':''))+'</option>'}).join('')+'<option value="__nuevo">Producto nuevo…</option></select>'+
    '<div id="itNuevo" class="par" hidden><input type="text" id="itNom" maxlength="50" placeholder="Nombre del producto" aria-label="Nombre del producto nuevo"><input id="itPre" inputmode="decimal" autocomplete="off" placeholder="Precio" aria-label="Precio del producto nuevo"><button type="button" class="btn sec" data-a="itNuevo">Agregar</button></div>'+
    (IT.length?'<div class="nota">El monto es la suma de los productos. Los precios se guardan en el historial de cada producto.</div><label class="c">Dónde compraste (opcional)<input type="text" name="lugar" maxlength="40" list="itLugares" value="'+esc(ITL)+'" placeholder="Ej.: Coto"></label><datalist id="itLugares">'+Object.keys(lugares).map(function(l){return '<option value="'+esc(l)+'">'}).join('')+'</datalist>':'');
}
function montoItems(){var m=$('#hoja form[data-f=gasto] [name=monto]');if(!m)return;if(IT.length){m.value=fmtN.format(totalItems());m.readOnly=true}else m.readOnly=false}
function pintarItems(){var e=$('#items');if(e){e.innerHTML=bloqueItems();montoItems()}}
function hojaGasto(g){
  var nuevo=!g;g=g||{cat:'c-comida',fecha:hoy(),medio:ultimoMedio(),nota:''};
  IT=(g.items||[]).map(function(i){return {prod:i.prod,nombre:i.nombre,cant:+i.cant||1,precio:+i.precio||0}});ITL=g.lugar||'';
  abrir(nuevo?'Nuevo gasto':'Editar gasto','<form data-f="gasto" data-id="'+esc(g.id||'')+'">'+campoMonto(g.monto,nuevo)+
    '<div id="items">'+bloqueItems()+'</div>'+
    '<label class="c">Categoría</label><div class="elige">'+opCats(cat(g.cat).id)+'</div>'+
    '<div class="par"><label class="c">Fecha<input type="date" name="fecha" value="'+esc(g.fecha)+'" required></label><label class="c">Medio de pago<select name="medio">'+opMedios(g.medio)+'</select></label></div>'+
    '<label class="c">Nota (opcional)<input type="text" name="nota" maxlength="80" value="'+esc(g.nota||'')+'" placeholder="Ej.: almuerzo en el comedor"></label>'+
    (g.fijo?'<div class="aviso">Este gasto lo anotó un gasto fijo. Si cambió el precio, corregilo acá y actualizá el fijo para los próximos meses.</div>':'')+
    '<div class="fila-btn"><button class="btn" type="submit">'+(nuevo?'Guardar gasto':'Guardar cambios')+'</button>'+(nuevo?'':'<button class="btn pel" type="button" data-a="borrarGasto" data-id="'+esc(g.id)+'">Borrar</button>')+'</div></form>');
  montoItems();
}

  var k=nuevo?hoy():(proximoCobro(f)||f.inicio);

    '<label class="c">Nombre<input type="text" name="nombre" maxlength="50" value="'+esc(f.nombre||'')+'" placeholder="Ej.: Netflix" required'+(nuevo?' autofocus':'')+'></label>'+campoMonto(f.monto,false)+
    '<div class="par"><label class="c">Se cobra<select name="frec"><option value="mensual"'+(f.frec!=='anual'?' selected':'')+'>Todos los meses</option><option value="anual"'+(f.frec==='anual'?' selected':'')+'>Una vez por año</option></select></label>'+
    '<label class="c">Próximo cobro<input type="date" name="inicio" value="'+esc(k)+'" required></label></div>'+

    '<label class="c">Medio de pago<select name="medio">'+opMedios(f.medio)+'</select></label>'+

    (nuevo?'':'<div class="fila-btn"><button class="btn sec" type="button" data-a="pausarFijo" data-id="'+esc(f.id)+'">'+(f.activo===false?'Reactivar':'Pausar')+'</button><button class="btn pel" type="button" data-a="borrarFijo" data-id="'+esc(f.id)+'">Borrar</button></div>')+'</form>');
}
function grafico(h){
  if(h.length<2)return '';
  var W=320,H=84,px=6,py=12,min=Math.min.apply(null,h.map(function(p){return p.monto})),max=Math.max.apply(null,h.map(function(p){return p.monto}));
  var t0=fecha(h[0].fecha).getTime(),t1=fecha(h[h.length-1].fecha).getTime(),dt=Math.max(1,t1-t0),dv=Math.max(1e-9,max-min);
  var pts=h.map(function(p,i){var x=t1===t0?px+(W-2*px)*i/(h.length-1):px+(W-2*px)*(fecha(p.fecha).getTime()-t0)/dt,y=H-py-(H-2*py)*(p.monto-min)/dv;return [x,y]});
  return '<svg class="linea" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolución del precio: de '+esc(plata(h[0].monto))+' a '+esc(plata(h[h.length-1].monto))+'">'+
    '<polyline fill="none" stroke="#f2c14e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'+
    pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.5)+'" fill="#f2c14e" stroke="#132030" stroke-width="2" vector-effect="non-scaling-stroke"><title>'+esc(fCorta(h[i].fecha)+': '+plata(h[i].monto))+'</title></circle>'}).join('')+'</svg>';
}
function hojaProd(id){
  var p=DB.prods[id];if(!p||p.del)return cerrar();
  var h=preciosDe(id),u=h[h.length-1],pr=h[0],v=h.length>1?pct(u.monto,pr.monto):null;
  var porLugar={};h.forEach(function(x){if(x.lugar)porLugar[x.lugar.toLowerCase()]=x});
  var lug=Object.keys(porLugar).map(function(k){return porLugar[k]}).sort(function(a,b){return a.monto-b.monto});
  abrir(p.nombre,(u?'<div class="tenue">Último precio</div><div class="saldo" style="color:var(--oro)">'+plata(u.monto)+'</div>'+
      (v!=null?'<span class="comp '+(v>0?'contra':v<0?'favor':'tenue')+'">'+(v>0?'▲ Subió ':v<0?'▼ Bajó ':'Igual, ')+Math.abs(v)+'% desde el '+fCorta(pr.fecha)+' ('+plata(pr.monto)+')</span>':'')+grafico(h):'<div class="aviso">Todavía no tiene precios.</div>')+
    '<div class="fila-btn"><button class="btn" data-a="nuevoPrecio" data-id="'+esc(id)+'">Agregar precio</button></div>'+
    (lug.length>1?'<h2>Dónde conviene</h2><div class="tarjeta">'+lug.map(function(x,i){return '<div class="fila"><span class="em">'+(i===0?'🥇':'📍')+'</span><span class="med"><div>'+esc(x.lugar)+'</div><small>'+fCorta(x.fecha)+(i===0?', el más barato':'')+'</small></span><span class="der">'+plata(x.monto)+'</span></div>'}).join('')+'</div>':'')+
    (h.length?'<h2>Historial</h2><div class="tarjeta">'+h.slice().reverse().map(function(x,i,arr){var prev=arr[i+1],d=prev?pct(x.monto,prev.monto):null;
      return '<div class="fila"><span class="med"><div>'+fCorta(x.fecha)+(x.lugar?', '+esc(x.lugar):'')+'</div><small>'+(d==null?'Primer registro':d===0?'Sin cambio':(d>0?'▲ ':'▼ ')+Math.abs(d)+'% contra el anterior')+'</small></span><span class="der">'+plata(x.monto)+'</span>'+
        '<button class="btn pel ch" data-a="borrarPrecio" data-id="'+esc(x.id)+'" data-p="'+esc(id)+'" aria-label="Borrar este precio">✕</button></div>'}).join('')+'</div>':'')+
    '<div class="fila-btn"><button class="btn sec" data-a="renombrarProd" data-id="'+esc(id)+'">Cambiar nombre</button><button class="btn pel" data-a="borrarProd" data-id="'+esc(id)+'">Borrar producto</button></div>');
}

/* ---------- acciones ---------- */
function confirma(el,txt){if(el.dataset.ok)return true;el.dataset.ok='1';el.textContent=txt||'Tocá de nuevo para borrar';setTimeout(function(){delete el.dataset.ok},4000);return false}
var A={
  tab:function(d){S.tab=d.t;window.scrollTo(0,0);pintar()},
  mes:function(d){S.mes=mesSuma(S.mes,+d.n);pintar()},
  sub:function(d){S.sub=d.s;pintar()},
  hist:function(d){S.hist=d.h;pintar()},
  irMes:function(d){S.tab='gastos';S.mes=d.m;S.sub='lista';S.todo=false;window.scrollTo(0,0);pintar()},
  fondo:function(){try{LS.setItem(K_FONDO,fondoOn()?'0':'1')}catch(e){}aplicarFondo();hojaAjustes()},
  cerrar:cerrar,
  velo:function(d,el,ev){if(ev.target===el)cerrar()},
  nuevoGasto:function(){hojaGasto(null)},
  editarGasto:function(d){var g=DB.gastos[d.id];if(g&&!g.del)hojaGasto(g)},
  borrarGasto:function(d,el){if(!confirma(el))return;borra('gastos',d.id);cerrar();guardar();tostada('Gasto borrado')},
  nuevoFijo:function(){hojaFijo(null)},
  editarFijo:function(d){var f=DB.fijos[d.id];if(f&&!f.del)hojaFijo(f)},
  pausarFijo:function(d){var f=DB.fijos[d.id];if(!f)return;
    if(f.activo===false){f.activo=true;var h=hoy(),y=+h.slice(0,4),m=+h.slice(5,7)-1,k;
      if(f.frec==='anual'){m=f.mes;k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))));if(k<h){y++;k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))))}}
      else{k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))));if(k<h){m++;y+=Math.floor(m/12);m%=12;k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))))}}
      f.inicio=k;tostada('Reactivado: próximo cobro '+fDia(k).toLowerCase());
    }else{f.activo=false;tostada('En pausa: no se anota hasta que lo reactives')}
    pon('fijos',f);generarFijos();cerrar();guardar()},
  borrarFijo:function(d,el){if(!confirma(el))return;borra('fijos',d.id);cerrar();guardar();tostada('Gasto fijo borrado. Los gastos ya anotados quedan.')},
  nuevoProd:function(){abrir('Nuevo producto','<form data-f="prod"><label class="c">Producto<input type="text" name="nombre" maxlength="50" placeholder="Ej.: Yerba 1 kg" required autofocus></label>'+camposPrecio()+'<div class="fila-btn"><button class="btn" type="submit">Guardar producto</button></div></form>')},
  verProd:function(d){hojaProd(d.id)},
  nuevoPrecio:function(d){var p=DB.prods[d.id];abrir('Precio de '+p.nombre,'<form data-f="precio" data-id="'+esc(d.id)+'">'+camposPrecio().replace('required>','required autofocus>')+'<div class="fila-btn"><button class="btn" type="submit">Guardar precio</button></div></form>')},
  borrarPrecio:function(d,el){if(!confirma(el,'¿Borrar?'))return;borra('precios',d.id);guardar();hojaProd(d.p)},
  renombrarProd:function(d){var p=DB.prods[d.id];abrir('Cambiar nombre','<form data-f="renProd" data-id="'+esc(d.id)+'"><label class="c">Producto<input type="text" name="nombre" maxlength="50" value="'+esc(p.nombre)+'" required autofocus></label><div class="fila-btn"><button class="btn" type="submit">Guardar nombre</button></div></form>')},
  borrarProd:function(d,el){if(!confirma(el))return;preciosDe(d.id).forEach(function(x){borra('precios',x.id)});borra('prods',d.id);cerrar();guardar();tostada('Producto borrado')},
  nuevaPersona:function(){abrir('Nueva persona','<form data-f="persona"><label class="c">Nombre<input type="text" name="nombre" maxlength="40" required autofocus></label><div class="fila-btn"><button class="btn" type="submit">Guardar persona</button></div></form>')},
  verPersona:function(d){hojaPersona(d.id)},
  nuevoMov:function(d){var p=DB.personas[d.id],t=TIPOS[d.t],s=Math.abs(Math.round(saldo(d.id)*100)/100),pago=d.t==='mepago'||d.t==='lepague';
    abrir(t[0]+' · '+p.nombre,'<form data-f="mov" data-id="'+esc(d.id)+'" data-t="'+esc(d.t)+'">'+campoMonto(pago?s:0,true)+(pago?'<div class="nota">Cargué el total de la deuda. Si fue un pago parcial, cambiá el monto.</div>':'')+
      '<div class="par"><label class="c">Motivo (opcional)<input type="text" name="motivo" maxlength="60"></label><label class="c">Fecha<input type="date" name="fecha" value="'+hoy()+'" required></label></div>'+
      '<div class="fila-btn"><button class="btn" type="submit">Guardar</button></div></form>')},
  borrarMov:function(d,el){if(!confirma(el,'¿Borrar?'))return;borra('movs',d.id);guardar();hojaPersona(d.p)},
  renombrarPersona:function(d){var p=DB.personas[d.id];abrir('Cambiar nombre','<form data-f="renPersona" data-id="'+esc(d.id)+'"><label class="c">Nombre<input type="text" name="nombre" maxlength="40" value="'+esc(p.nombre)+'" required autofocus></label><div class="fila-btn"><button class="btn" type="submit">Guardar nombre</button></div></form>')},
  borrarPersona:function(d,el){if(!confirma(el))return;vivos('movs').forEach(function(m){if(m.persona===d.id)borra('movs',m.id)});borra('personas',d.id);cerrar();guardar();tostada('Persona borrada')},
  itQuita:function(d){IT.splice(+d.i,1);pintarItems()},
  itNuevo:function(){var n=$('#itNom').value.trim(),pr=aNum($('#itPre').value);if(!n){$('#itNom').focus();return}
    var ex=vivos('prods').filter(function(x){return x.nombre.toLowerCase()===n.toLowerCase()})[0];
    IT.push({prod:ex?ex.id:null,nombre:ex?ex.nombre:n,cant:1,precio:pr>0?pr:(ex?ultimoPrecio(ex.id):0)});pintarItems()},

    borra('cats',d.id);if(S.fcat===d.id)S.fcat='';guardar();hojaAjustes();tostada('Categoría borrada')},

  quitarToken:function(d,el){if(!confirma(el,'Tocá de nuevo para desconectar'))return;LS.removeItem(K_TOKEN);LS.removeItem(K_GIST);Y.estado='';pintarNube();hojaAjustes();if(token())sincronizar()},
  exportar:function(){bajar('mis-finanzas-'+hoy()+'.json',JSON.stringify({app:'mis-finanzas',v:1,exportado:new Date().toISOString(),data:DB},null,1),'application/json')},

    var l=gastos().sort(function(a,b){return a.fecha<b.fecha?-1:1}),q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
    bajar('gastos-'+hoy()+'.csv','﻿'+['Fecha;Monto;Categoría;Medio de pago;Nota;Fijo;Productos'].concat(l.map(function(g){return [g.fecha,String(g.monto).replace('.',','),q(cat(g.cat).nombre),q(g.medio),q(g.nota),g.fijo?'sí':'no',q((g.items||[]).map(function(i){return fmtN.format(i.cant)+' x '+i.nombre+' a '+fmtN.format(i.precio)}).join(' | '))].join(';')})).join('\r\n'),'text/csv');

function bajar(nombre,texto,tipo){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:tipo+';charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- formularios ---------- */
function montoDe(o,form){var n=aNum(o.monto);if(!(n>0)){tostada('Poné un monto mayor a cero');var i=form.querySelector('[name=monto]');if(i)i.focus();return null}return n}
function gastoDeCompra(o,monto,nota){pon('gastos',{monto:monto,cat:o.cat||'c-otros',fecha:o.fecha,medio:o.medio||'',nota:nota})}
var F={
  gasto:function(o,form){
    if(IT.length){if(IT.some(function(i){return !(i.cant>0)||!(i.precio>0)})){tostada('Revisá la cantidad y el precio de cada producto');return}o.monto=fmtN.format(totalItems())}
    var n=montoDe(o,form);if(n==null||!esFecha(o.fecha))return;
    var g=form.dataset.id?DB.gastos[form.dataset.id]:{};g=Object.assign({},g,{monto:n,cat:o.cat||'c-otros',fecha:o.fecha,medio:o.medio||'',nota:(o.nota||'').trim()});
    if(IT.length){
      var lugar=ITL.trim();
      g.items=IT.map(function(it){
        var pid=it.prod&&DB.prods[it.prod]&&!DB.prods[it.prod].del?it.prod:prodPorNombre(it.nombre).id;
        if(!vivos('precios').some(function(p){return p.prod===pid&&p.fecha===o.fecha&&p.monto===it.precio}))pon('precios',{prod:pid,monto:it.precio,lugar:lugar,fecha:o.fecha});
        return {prod:pid,nombre:it.nombre,cant:it.cant,precio:it.precio}});
      g.lugar=lugar;
      if(!g.nota)g.nota=IT.map(function(i){return i.nombre}).join(', ').slice(0,80);
    }else{delete g.items;delete g.lugar}
    pon('gastos',g);if(mesDe(g.fecha)!==S.mes&&S.tab==='gastos')S.mes=mesDe(g.fecha);cerrar();guardar();tostada(form.dataset.id?'Cambios guardados':'Gasto guardado: '+plata(n))},
  fijo:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.inicio)||!o.nombre.trim())return;
    var f=form.dataset.id?DB.fijos[form.dataset.id]:{activo:true},d=fecha(o.inicio);
    f=Object.assign({},f,{nombre:o.nombre.trim(),monto:n,frec:o.frec==='anual'?'anual':'mensual',inicio:o.inicio,dia:d.getDate(),mes:d.getMonth(),cat:o.cat||'c-suscripciones',medio:o.medio||''});
    pon('fijos',f);var hubo=generarFijos();cerrar();guardar();tostada(hubo?'Guardado, y anoté el cobro que ya correspondía':'Gasto fijo guardado')},
  prod:function(o,form){var n=montoDe(o,form);if(n==null||!o.nombre.trim()||!esFecha(o.fecha))return;
    var p=pon('prods',{nombre:o.nombre.trim()});pon('precios',{prod:p.id,monto:n,lugar:(o.lugar||'').trim(),fecha:o.fecha});
    if(o.compre)gastoDeCompra(o,n,p.nombre);cerrar();guardar();tostada(o.compre?'Producto guardado y gasto anotado':'Producto guardado')},
  precio:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha))return;var id=form.dataset.id;
    pon('precios',{prod:id,monto:n,lugar:(o.lugar||'').trim(),fecha:o.fecha});if(o.compre)gastoDeCompra(o,n,DB.prods[id].nombre);
    guardar();hojaProd(id);tostada(o.compre?'Precio guardado y gasto anotado':'Precio guardado')},
  renProd:function(o,form){var p=DB.prods[form.dataset.id];if(!o.nombre.trim())return;p.nombre=o.nombre.trim();pon('prods',p);guardar();hojaProd(p.id)},
  persona:function(o){if(!o.nombre.trim())return;var p=personaPorNombre(o.nombre);guardar();hojaPersona(p.id)},
  renPersona:function(o,form){var p=DB.personas[form.dataset.id];if(!o.nombre.trim())return;p.nombre=o.nombre.trim();pon('personas',p);guardar();hojaPersona(p.id)},
  mov:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha))return;var id=form.dataset.id;
    pon('movs',{persona:id,tipo:form.dataset.t,monto:n,motivo:(o.motivo||'').trim(),fecha:o.fecha});guardar();hojaPersona(id);
    var s=Math.round(saldo(id)*100)/100;tostada(s===0?'Listo: quedaron a mano':'Guardado')},
  presu:function(o){var n=aNum(o.presu),w=aNum(o.presuSem);DB.cfg={presu:n>0?n:0,presuSem:w>0?w:0,upd:Date.now()};guardar();hojaAjustes();tostada(n>0||w>0?'Presupuesto guardado':'Presupuesto quitado')},
  cat:function(o,form){if(!o.nombre.trim())return;var id=form.dataset.id,c=id?DB.cats[id]:{orden:cats().length},n=aNum(o.presu);
    c=Object.assign({},c,{nombre:o.nombre.trim(),emoji:(o.emoji||'🧩').trim()||'🧩',presu:n>0?n:0});pon('cats',c);guardar();hojaAjustes();tostada('Categoría guardada')},
  token:function(o){var t=(o.token||'').trim();if(!t)return;LS.setItem(K_TOKEN,t);Y.estado='';sincronizar(true).then(hojaAjustes)},
  dividir:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha)||!o.nota.trim())return;
    var ids=[].concat(o.con||[]),nuevas=(o.nuevas||'').split(',').map(function(s){return s.trim()}).filter(Boolean).map(function(nm){return personaPorNombre(nm).id});
    ids=ids.concat(nuevas).filter(function(x,i,a){return a.indexOf(x)===i});
    if(!ids.length){tostada('Elegí al menos una persona');return}
    var pagador=o.pago==='nueva'?nuevas[0]:o.pago;
    if(o.pago==='nueva'&&!pagador){tostada('Escribí el nombre de quien pagó en "Otras personas"');return}
    if(pagador!=='yo'&&ids.indexOf(pagador)<0)ids.push(pagador);
    var parte=Math.round(n/(ids.length+1)*100)/100,nota=o.nota.trim();
    pon('gastos',{monto:parte,cat:o.cat||'c-otros',fecha:o.fecha,medio:pagador==='yo'?(o.medio||''):'',nota:nota+' (dividido entre '+(ids.length+1)+')'});
    if(pagador==='yo')ids.forEach(function(pid){pon('movs',{persona:pid,tipo:'presto',monto:parte,motivo:nota,fecha:o.fecha})});
    else pon('movs',{persona:pagador,tipo:'meprestaron',monto:parte,motivo:nota,fecha:o.fecha});
    cerrar();guardar();tostada(pagador==='yo'?'Tu parte: '+plata(parte)+'. Cada uno te debe '+plata(parte):'Tu parte: '+plata(parte)+'. Se la debés a '+DB.personas[pagador].nombre)}
};

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var a=A[el.dataset.a];if(a){if(el.tagName==='BUTTON'&&el.type!=='submit')ev.preventDefault();a(el.dataset,el,ev)}
});
document.addEventListener('submit',function(ev){
  var form=ev.target.closest('form[data-f]');if(!form)return;ev.preventDefault();
  var o={};new FormData(form).forEach(function(v,k){if(k in o){o[k]=[].concat(o[k],v)}else o[k]=v});
  if(o.con!=null)o.con=[].concat(o.con);
  F[form.dataset.f](o,form);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.k&&t.closest('#items')){var it=IT[+t.dataset.i];if(it){var v=aNum(t.value);it[t.dataset.k]=v>0?v:0;$('#its'+t.dataset.i).textContent=plata(it.cant*it.precio);montoItems()}}
  else if(t.name==='lugar'&&t.closest('#items'))ITL=t.value;
  else if(t.id==='q'){S.q=t.value;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='pq'){S.pq=t.value;var q=S.pq.trim().toLowerCase();$('#plista').innerHTML=listaProds(vivos('prods').filter(function(p){return !q||p.nombre.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.nombre.localeCompare(b.nombre)}))}
  else if(t.form&&t.form.dataset.f==='dividir')textoDividir(t.form);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='itAdd'){
    if(t.value==='__nuevo'){$('#itNuevo').hidden=false;$('#itNom').focus()}
    else if(t.value){var pr=DB.prods[t.value],ya=IT.filter(function(i){return i.prod===pr.id})[0];if(ya)ya.cant=(+ya.cant||0)+1;else IT.push({prod:pr.id,nombre:pr.nombre,cant:1,precio:ultimoPrecio(pr.id)});pintarItems()}
  }
  else if(t.id==='fcat'){S.fcat=t.value;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='todo'){S.todo=t.checked;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='compre'){$('#compreMas').hidden=!t.checked}
  else if(t.id==='archivo'&&t.files[0]){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.app!=='mis-finanzas'||!j.data)throw 0;combinar(j.data);generarFijos();guardar();hojaAjustes();tostada('Datos importados y combinados con los que tenías')}catch(e){tostada('Ese archivo no es una copia de Mis Finanzas')}};r.readAsText(t.files[0]);t.value=''}
  else if(t.form&&t.form.dataset.f==='dividir')textoDividir(t.form);
});
function textoDividir(form){
  var n=aNum(form.monto.value),c=form.querySelectorAll('[name=con]:checked').length+form.nuevas.value.split(',').filter(function(s){return s.trim()}).length;
  $('#divTexto').textContent=n>0&&c>0?'Entre '+(c+1)+' personas: '+plata(Math.round(n/(c+1)*100)/100)+' cada una. Tu parte se anota como gasto.':'Se divide en partes iguales. Tu parte se anota como gasto.';
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#hoja').firstChild)cerrar();
  else if(ev.key==='Enter'&&ev.target.closest&&ev.target.closest('#items')){ev.preventDefault();if(ev.target.id==='itNom'||ev.target.id==='itPre')A.itNuevo()}
});

/* ---------- sincronización (Gist privado, combinación automática por registro) ---------- */
var Y={estado:'',texto:'',ocupado:false,otra:false,t:null,revisado:false};
function token(){try{return LS.getItem(K_TOKEN)||LS.getItem(K_TOKEN_HAB)||''}catch(e){return ''}}
function pintarNube(){
  var e=$('#nube'),tk=token(),st=tk?(Y.estado||'va'):'';
  e.className='chip'+(st==='ok'?' ok':st==='mal'?' mal':st==='va'?' va':'');
  e.querySelector('span').textContent=!tk?'Sin nube':st==='ok'?'Al día':st==='mal'?'Sin subir':'Sincronizando';
  e.title=Y.texto||'';
}
function api(metodo,ruta,cuerpo){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},20000);
  return fetch(ruta.indexOf('http')===0?ruta:API+ruta,{method:metodo,cache:'no-store',signal:ctl.signal,
    headers:ruta.indexOf('http')===0?{}:{'Authorization':'Bearer '+token(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:cuerpo?JSON.stringify(cuerpo):undefined})
    .then(function(r){clearTimeout(t);if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;throw e}return r},function(e){clearTimeout(t);throw e});
}
function buscarGist(){
  var hallados=[];
  function pag(n){return api('GET','/gists?per_page=100&page='+n).then(function(r){return r.json()}).then(function(l){
    l.forEach(function(g){if(g.files&&g.files[FILE])hallados.push(g)});return l.length===100&&n<5?pag(n+1):null})}
  return pag(1).then(function(){hallados.sort(function(a,b){return a.created_at<b.created_at?-1:1});return hallados[0]?hallados[0].id:null});
}
function asegurarGist(){
  var id=LS.getItem(K_GIST);
  if(id&&Y.revisado)return Promise.resolve(id);
  /* una vez por sesión: si hay más de una copia en la cuenta, todos los dispositivos usan la más vieja */
  return buscarGist().then(function(viejo){
    Y.revisado=true;
    if(viejo){if(viejo!==id)LS.setItem(K_GIST,viejo);return viejo}
    var files={};files[FILE]={content:JSON.stringify(DB)};
    return api('POST','/gists',{description:'Mis Finanzas: sincronización (no borrar)',public:false,files:files}).then(function(r){return r.json()}).then(function(g){LS.setItem(K_GIST,g.id);return g.id});
  });
}
function leerGist(id){
  return api('GET','/gists/'+id).then(function(r){return r.json()}).then(function(g){
    var f=g.files&&g.files[FILE];if(!f)return {falta:true};
    var txt=f.truncated?api('GET',f.raw_url).then(function(r){return r.text()}):Promise.resolve(f.content);
    return txt.then(function(s){var j=JSON.parse(s);if(!j||typeof j!=='object')throw new Error('contenido inválido');return {data:j}});
  });
}
function sincronizar(aMano){
  if(!token()){Y.estado='';Y.texto='';pintarNube();return Promise.resolve()}
  if(Y.ocupado){Y.otra=true;return Promise.resolve()}
  Y.ocupado=true;Y.otra=false;if(Y.estado!=='ok'||aMano){Y.estado='va';pintarNube()}
  return asegurarGist().then(function(id){
    return leerGist(id).then(function(rem){
      var r=rem.falta?{cambioLocal:false,localNuevo:true}:combinar(rem.data);
      if(r.cambioLocal){generarFijos();guardarLocal();if(!$('#hoja').firstChild||aMano)pintar();else Y.pintarLuego=true}
      if(!r.localNuevo)return;
      var files={};files[FILE]={content:JSON.stringify(DB)};
      return api('PATCH','/gists/'+id,{files:files});
    });
  }).then(function(){
    Y.estado='ok';Y.texto='Tus datos están al día en la nube.';LS.setItem(K_LAST,String(Date.now()));if(aMano)tostada('Sincronizado');
  },function(e){
    Y.estado='mal';
    Y.texto=e&&e.status===401?'El token no es válido o venció.':e&&e.status===403?'GitHub rechazó el pedido: revisá que el token tenga permiso gist.':e&&e.status===404?'No encontré la copia en la nube.':e&&e.status?'GitHub respondió con un error ('+e.status+').':'Sin conexión: se sube cuando vuelva.';
    if(e&&e.status===404){LS.removeItem(K_GIST);Y.revisado=false}
    if(aMano)tostada(Y.texto);
  }).then(function(){Y.ocupado=false;pintarNube();if(Y.otra)programarSync(400)});
}
function programarSync(ms){if(!token())return;if(Y.estado!=='mal'){Y.estado='va';pintarNube()}clearTimeout(Y.t);Y.t=setTimeout(sincronizar,ms)}
new MutationObserver(function(){if(Y.pintarLuego&&!$('#hoja').firstChild){Y.pintarLuego=false;pintar()}}).observe($('#hoja'),{childList:true});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){revisarDia();sincronizar()}});
window.addEventListener('online',function(){sincronizar()});
window.addEventListener('storage',function(e){if(e.key===K_DATA){cargar();pintar()}});
setInterval(function(){if(document.visibilityState==='visible'){revisarDia();sincronizar()}},60000);

/* al cambiar el día: anotar los fijos que vencieron y refrescar */
var diaVisto=hoy();
function revisarDia(){var h=hoy();if(h===diaVisto)return;diaVisto=h;if(generarFijos())guardar();else pintar()}

function fondoOn(){try{return LS.getItem(K_FONDO)!=='0'}catch(e){return true}}
function aplicarFondo(){$('#fondo').classList.toggle('quieto',!fondoOn())}

/* ---------- arranque ---------- */
aplicarFondo();
cargar();
if(generarFijos())guardarLocal();
pintar();
sincronizar();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js').catch(function(){})}
window.__fin={db:function(){return DB},estado:function(){return Y},sincronizar:sincronizar};
})();
</script>
